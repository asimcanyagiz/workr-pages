<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join me on Workr</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7; color: #1d1d1f; text-align: center; padding: 24px;
    }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
    .card { max-width: 420px; }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p { font-size: 17px; line-height: 1.5; opacity: 0.8; margin: 0 0 28px; }
    a.btn {
      display: inline-block; background: #ff9500; color: #fff; text-decoration: none;
      font-size: 17px; font-weight: 600; padding: 14px 28px; border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Join me on Workr</h1>
    <p>Workr is a clean, fast to-do &amp; project planner with on-device AI. Tap below to get it — if you already have it installed, it'll open right up.</p>
    <a class="btn" id="store" href="https://apps.apple.com/app/id6772935966">Get Workr</a>
  </div>
  <script>
    // Bridge: if the app is installed, the custom scheme opens it (and this page
    // is left behind); otherwise the App Store fallback below runs. `ref` is the
    // inviter's opaque, non-PII referral id, passed straight through.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var ref = params.get('ref') || '';
      var store = 'https://apps.apple.com/app/id6772935966';
      document.getElementById('store').setAttribute('href', store);
      if (ref) {
        // Attempt the app first; fall back to the store shortly after.
        var appURL = 'workr://invite?ref=' + encodeURIComponent(ref);
        var fell = false;
        var fallback = setTimeout(function () { fell = true; window.location.href = store; }, 1200);
        window.addEventListener('pagehide', function () { clearTimeout(fallback); });
        window.location.href = appURL;
      }
    })();
  </script>
</body>
</html>
